<!-- Guest home only (index.html): the boarding list sign-up -->
<!-- NEWSLETTER: the boarding list (deck: "Something big is boarding soon") -->
<section id="newsletter" class="fc-boardcall relative overflow-hidden" aria-labelledby="newsletter-title">
  <div class="fc-boardcall__grain" aria-hidden="true"></div>
  <div class="fc-boardcall__grid relative z-10 mx-auto max-w-7xl px-5 py-20 sm:px-8 lg:py-28">
    <figure class="fc-boardcall__sign">
      <img src="/images/deck/departures-board.webp" alt="Tablica odlotów z napisem: Something big is boarding soon" loading="lazy">
    </figure>
    <div class="fc-boardcall__copy">
      <p class="fc-eyebrow">Lista pokładowa · Sezon 2027</p>
      <h2 id="newsletter-title" class="fc-title fc-boardcall__title mt-4"><em data-neon>Flight Mode On</em></h2>
      <p class="fc-copy">Zapisz się na listę pokładową First Class. Jako pierwszy dowiesz się o nowych destynacjach, line-upach i otwarciu sprzedaży, zanim ogłosimy je publicznie.</p>
      <form id="newsletter-form" class="fc-boardcall__form" novalidate>
        <label class="sr-only" for="newsletter-email">Adres e-mail</label>
        <div class="fc-inline-field">
          <input id="newsletter-email" type="email" name="email" autocomplete="email" placeholder="Twój adres e-mail" required>
          <button type="submit" class="fc-btn fc-btn--primary" data-magnetic>Dołącz do listy</button>
        </div>
        <label class="fc-check"><input id="newsletter-consent" type="checkbox" required><span>Zgadzam się na otrzymywanie od First Class informacji o sezonie 2027 drogą mailową.</span></label>
        <p id="newsletter-status" class="fc-boardcall__status" aria-live="polite"></p>
      </form>
    </div>
  </div>
</section>
