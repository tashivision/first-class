<!-- 7. GALERIA ZDJĘĆ (presentation slide 18) — bento mosaic + lightbox -->
<section id="atmosphere" class="fc-gallery relative overflow-hidden">
  <div class="relative z-10 mx-auto max-w-7xl px-5 py-24 sm:px-8 lg:py-32">
    <div class="fc-bento" data-gallery>
      <button type="button" class="fc-bento__item fc-bento__item--a" data-tilt><img src="/images/image_13.jpg" alt="DJ w czapce gra dla tłumu pod sceną" loading="lazy"><span class="fc-glare" aria-hidden="true"></span></button>
      <!-- Video tile: season recap, autoplays muted -->
      <button type="button" class="fc-bento__item fc-bento__item--b fc-bento__item--video" data-tilt aria-label="Wideo z First Class: recap sezonu">
        <video autoplay muted loop playsinline preload="auto" poster="/images/after-event-poster.jpg" data-autoplay-visible><source src="/videos/after-event.mp4" type="video/mp4"></video>
        <span class="fc-bento__play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" /></svg>Video</span>
        <span class="fc-glare" aria-hidden="true"></span>
      </button>
      <button type="button" class="fc-bento__item fc-bento__item--c" data-tilt><img src="/images/dj_energy.jpg" alt="Artysta przy konsolecie w pomarańczowym świetle" loading="lazy"><span class="fc-glare" aria-hidden="true"></span></button>
      <div class="fc-bento__title">
        <h2 class="fc-title"><span>Galeria</span> <em data-neon>zdjęć</em></h2>
        <p>Doświadczenie marki w realnym świecie: dźwięk, przestrzeń i autentyczna społeczność.</p>
      </div>
      <button type="button" class="fc-bento__item fc-bento__item--d" data-tilt><img src="/images/image_15.jpg" alt="Scena i tłum w ciepłym świetle reflektorów" loading="lazy"><span class="fc-glare" aria-hidden="true"></span></button>
      <button type="button" class="fc-bento__item fc-bento__item--e" data-tilt><img src="/images/gallery-venue.jpg" alt="Goście przed hangarem Aeroklubu w dniu First Class" loading="lazy"><span class="fc-glare" aria-hidden="true"></span></button>
      <button type="button" class="fc-bento__item fc-bento__item--f" data-tilt><img src="/images/guests_dancing.jpg" alt="Goście tańczący pod sceną" loading="lazy"><span class="fc-glare" aria-hidden="true"></span></button>
      <button type="button" class="fc-bento__item fc-bento__item--g" data-tilt><img src="/images/dj_offwhite.jpg" alt="DJ i goście w czerwonym świetle" loading="lazy"><span class="fc-glare" aria-hidden="true"></span></button>
      <button type="button" class="fc-bento__item fc-bento__item--h" data-tilt><img src="/images/gallery-bar.jpg" alt="Podświetlony bar partnera podczas First Class" loading="lazy"><span class="fc-glare" aria-hidden="true"></span></button>
      <button type="button" class="fc-bento__item fc-bento__item--i" data-tilt><img src="/images/gallery-crowd.jpg" alt="Tłum w hangarze w świetle laserów" loading="lazy"><span class="fc-glare" aria-hidden="true"></span></button>
      <button type="button" class="fc-bento__item fc-bento__item--j" data-tilt><img src="/images/gallery-guests.jpg" alt="Goście First Class na parkiecie" loading="lazy"><span class="fc-glare" aria-hidden="true"></span></button>
      <button type="button" class="fc-bento__item fc-bento__item--k" data-tilt><img src="/images/gallery-bottle.jpg" alt="Ekspozycja produktu partnera na barze" loading="lazy"><span class="fc-glare" aria-hidden="true"></span></button>
      <button type="button" class="fc-bento__item fc-bento__item--l" data-tilt><img src="/images/gallery-partner-bar.jpg" alt="Podświetlone stoisko partnera w hangarze" loading="lazy"><span class="fc-glare" aria-hidden="true"></span></button>
      <button type="button" class="fc-bento__item fc-bento__item--m" data-tilt><img src="/images/gallery-lights.jpg" alt="DJ w snopach światła pod logo partnera" loading="lazy"><span class="fc-glare" aria-hidden="true"></span></button>
    </div>
  </div>

  <dialog class="fc-lightbox" aria-label="Podgląd galerii">
    <figure><img alt=""><video controls playsinline hidden></video><figcaption></figcaption></figure>
    <button type="button" class="fc-lightbox__close" aria-label="Zamknij">✕</button>
    <button type="button" class="fc-lightbox__nav fc-lightbox__nav--prev" aria-label="Poprzednie">←</button>
    <button type="button" class="fc-lightbox__nav fc-lightbox__nav--next" aria-label="Następne">→</button>
  </dialog>
</section>
